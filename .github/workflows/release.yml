name: Release

# Pushing a tag such as v0.2 builds a signed APK and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history and tags, needed by version.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set, refusing to publish an unsigned APK (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RIDEBRIDGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compute version
        run: .github/scripts/version.sh >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RIDEBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RIDEBRIDGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RIDEBRIDGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --stacktrace
          -PversionName="$versionName"
          -PversionCode="$versionCode"

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"
          cp "$APK" "ridebridge-$TAG.apk"

      # The release may already exist (created by hand on GitHub, which also creates the tag): then only attach the
      # APK and keep its title and notes.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ridebridge-$TAG.apk" --clobber
          else
            gh release create "$TAG" "ridebridge-$TAG.apk" --title "$TAG" --generate-notes --verify-tag
          fi
